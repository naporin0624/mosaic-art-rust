[package]
name = "mosaic-rust"
version = "0.3.0"
edition = "2021"

[dependencies]
image = "0.25"
fast_image_resize = { version = "5", features = ["rayon"] }
palette = { version = "0.7", features = ["std"] }
kiddo = "5"
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
# GUI dependencies (only built with the `gui` feature)
iced = { version = "0.12", features = ["tokio", "advanced"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
rfd = { version = "0.14", optional = true }

# Internationalization dependencies (GUI only)
i18n-embed = { version = "0.14", features = [
    "fluent-system",
    "desktop-requester",
], optional = true }
fluent-bundle = { version = "0.15", optional = true }
unic-langid = { version = "0.9", features = ["macros"], optional = true }
rust-embed = { version = "8", optional = true }
once_cell = { version = "1.19", optional = true }

[features]
default = []
gui = [
    "dep:iced",
    "dep:tokio",
    "dep:rfd",
    "dep:i18n-embed",
    "dep:fluent-bundle",
    "dep:unic-langid",
    "dep:rust-embed",
    "dep:once_cell",
]

[dev-dependencies]
tempfile = "3.10"

# Binary targets
[[bin]]
name = "mosaic-rust"
path = "src/main.rs"

[[bin]]
name = "mosaic-gui"
path = "src/gui/main.rs"
test = false
required-features = ["gui"]

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
